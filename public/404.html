<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 - ImgCompress</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #e4e4e7;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 72px;
        background: linear-gradient(135deg, #c4b5fd, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { color: #a1a1aa; margin: 12px 0 28px; }
      a {
        display: inline-block;
        padding: 12px 32px;
        border-radius: 16px;
        background: linear-gradient(90deg, #8b5cf6, #7c3aed);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>404</h1>
      <p>页面不存在 · Page not found</p>
      <a id="home" href="/">返回 ImgCompress</a>
    </div>
    <script>
      // GitHub Pages serves this app under /img-compress/; the primary domain uses /
      document.getElementById('home').href = location.pathname.indexOf('/img-compress') === 0 ? '/img-compress/' : '/';
    </script>
  </body>
</html>
